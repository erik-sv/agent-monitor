# Example GitHub Repository Monitor
# Tracks PRs and issues on repos you care about.
#
# Copy this directory to create your own monitor:
#   cp -r monitors/example monitors/my-project
#   Edit monitor.conf, PROMPT.md, and pre-check.sh for your repos.

MONITOR_DISPLAY_NAME="Example Monitor"
LOOKBACK_HOURS=12
DISCORD_EMBED_COLOR=3447003

# Add your tracked repos here (used by pre-check.sh)
TRACKED_REPOS=(
  "anthropics/claude-code"
  "facebook/react"
)
